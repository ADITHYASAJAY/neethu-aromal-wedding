<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9E4DA" />
    <meta
      name="description"
      content="Join us in celebrating the wedding of Aromal & Neethu on 28 December 2026."
    />
    <title>Aromal &amp; Neethu · 28 December 2026</title>

    <!-- Fonts: Pinyon Script (names) · Cormorant Garamond (headings/body) · Jost (labels/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Audio Loop -->
    <audio id="bg-music" loop preload="auto">
  <source src="/src/assets/music/wedding-song.mp3" type="audio/mpeg" />
</audio>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    var music = document.getElementById("bg-music");
    var hasStarted = false;

    function playMusic() {
      if (!hasStarted) {
        music.play().then(function() {
          hasStarted = true;
          // Remove event listeners once music successfully starts playing
          window.removeEventListener("click", playMusic);
          window.removeEventListener("scroll", playMusic);
          window.removeEventListener("touchstart", playMusic);
        }).catch(function(error) {
          // Autoplay was prevented; will retry on next interaction
        });
      }
    }

    // Try playing immediately on load (will work if browser permits)
    playMusic();

    // Listen for the first click, scroll, or touch interaction anywhere on the site
    window.addEventListener("click", playMusic, { once: true });
    window.addEventListener("scroll", playMusic, { once: true });
    window.addEventListener("touchstart", playMusic, { once: true });
  });
</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
