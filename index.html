<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9E4DA" />
    <meta
      name="description"
      content="Join us in celebrating the wedding of Aromal & Neethu on 28 December 2026."
    />
    <title>Aromal &amp; Neethu · 28 December 2026</title>

    <!-- Fonts: Pinyon Script (names) · Cormorant Garamond (headings/body) · Jost (labels/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Audio Loop -->
    <audio id="bg-music" loop preload="auto">
      <source src="src/assets/music/wedding-song.mp3" type="audio/mpeg" />
    </audio>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var music = document.getElementById("bg-music");
        
        // Try to play immediately on load
        music.play().catch(function(error) {
          // If browser blocks autoplay, play on the visitor's first click anywhere on the site
          document.body.addEventListener("click", function() {
            music.play();
          }, { once: true });
        });
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
