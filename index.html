<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9E4DA" />
    <meta
      name="description"
      content="Join us in celebrating the wedding of Aromal & Neethu on 28 December 2026."
    />
    <title>Aromal &amp; Neethu · 28 December 2026</title>

    <!-- Fonts: Pinyon Script (names) · Cormorant Garamond (headings/body) · Jost (labels/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background music: started by the "Open invitation" tap (see App.tsx) -->
    <audio id="bg-music" loop preload="none">
      <source src="/wedding-song.mp3" type="audio/mpeg" />
    </audio>

    <script>
      // Download the song only AFTER the page has finished loading, so it never
      // competes with the hero photo. Delete this block if you'd rather guests
      // download the 4 MB only when they tap "Open invitation".
      window.addEventListener("load", function () {
        var music = document.getElementById("bg-music");
        if (music) {
          music.preload = "auto";
          music.load();
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
