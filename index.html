<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F9E4DA" />
    <meta
      name="description"
      content="Join us in celebrating the wedding of Aromal & Neethu on 28 December 2026."
    />
    <title>Aromal &amp; Neethu · 28 December 2026</title>

    <!-- Fonts: Pinyon Script (names) · Cormorant Garamond (headings/body) · Jost (labels/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Audio Loop -->
    <audio id="bg-music" loop preload="auto">
  <source src="/wedding-song.mp3" type="audio/mpeg" />
</audio>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const music = document.getElementById('bg-music');
    
    // Function that attempts to play
    const playAudio = () => {
      music.play().then(() => {
        // Once successfully playing, remove all listeners so it runs smoothly
        window.removeEventListener('click', playAudio);
        window.removeEventListener('scroll', playAudio);
        window.removeEventListener('touchstart', playAudio);
      }).catch((err) => {
        console.log("Waiting for user interaction...");
      });
    };

    // Try playing immediately
    playAudio();

    // Listen for the absolute first user click, scroll, or touch on the window
    window.addEventListener('click', playAudio, { once: true });
    window.addEventListener('scroll', playAudio, { once: true });
    window.addEventListener('touchstart', playAudio, { once: true });
  });
</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
